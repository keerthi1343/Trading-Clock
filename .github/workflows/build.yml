name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name Clock clock.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Clock-windows
          path: dist/Clock.exe
